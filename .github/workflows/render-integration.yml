name: Video export integration
on:
  workflow_dispatch:
    inputs:
      format:
        description: Output format to verify
        required: true
        default: landscape
        type: choice
        options:
          - landscape
          - portrait
          - square
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm studio:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render and probe MP4
        env:
          TILO_AUDIT_RENDER: ${{ inputs.format }}
        run: pnpm exec tsx src/audit-studio-e2e.ts
