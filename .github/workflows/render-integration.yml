name: Video export integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/render.ts"
      - "src/composition.tsx"
      - "src/audio-*.ts"
      - "src/audit-studio-e2e.ts"
      - ".github/workflows/render-integration.yml"
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        format: [landscape, portrait, square]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm studio:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render and probe MP4 — ${{ matrix.format }}
        env:
          TILO_AUDIT_RENDER: ${{ matrix.format }}
          TILO_AUDIT_AUDIO: "1"
        run: pnpm exec tsx src/audit-studio-e2e.ts
