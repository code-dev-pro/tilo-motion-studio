name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: TypeScript check
        run: pnpm typecheck
      - name: Next.js production build
        run: pnpm studio:build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Isolated pointer capture smoke test
        run: pnpm exec tsx src/audit-pointer-smoke.ts
      - name: Studio browser and project management E2E
        run: pnpm exec tsx src/audit-studio-e2e.ts
